openapi: 3.2.0
info:
  title: Amazon Neptune Management ?Action=List Tags For Resource API
  description: Amazon Neptune Management API for creating, managing, and deleting Neptune DB clusters, instances, parameter groups, snapshots, and related infrastructure resources. This is an AWS Query API that uses HTTPS requests with Action and parameter query strings.
  version: '2014-10-31'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/neptune/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://rds.{region}.amazonaws.com
  description: Amazon Neptune Management API regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-north-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1
      - ap-northeast-2
      - ap-south-1
      - ca-central-1
      - me-south-1
      - sa-east-1
security:
- aws_sigv4: []
tags:
- name: ?Action=ListTagsForResource
paths:
  /?Action=ListTagsForResource:
    get:
      operationId: listTagsForResource
      summary: Amazon Neptune List Tags for a Neptune Resource
      description: Lists all tags on an Amazon Neptune resource.
      tags:
      - ?Action=ListTagsForResource
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - ListTagsForResource
      - name: ResourceName
        in: query
        required: true
        description: The ARN of the resource to list tags for.
        schema:
          type: string
      - name: Version
        in: query
        required: true
        schema:
          type: string
          default: '2014-10-31'
      responses:
        '200':
          description: Successful response with tags.
        '404':
          description: The specified resource was not found.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication
