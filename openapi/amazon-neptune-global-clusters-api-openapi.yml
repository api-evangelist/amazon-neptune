openapi: 3.2.0
info:
  title: Amazon Neptune Management Global Clusters API
  description: Amazon Neptune Management API for creating, managing, and deleting Neptune DB clusters, instances, parameter groups, snapshots, and related infrastructure resources. This is an AWS Query API that uses HTTPS requests with Action and parameter query strings.
  version: '2014-10-31'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/neptune/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://rds.{region}.amazonaws.com
  description: Amazon Neptune Management API regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-north-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1
      - ap-northeast-2
      - ap-south-1
      - ca-central-1
      - me-south-1
      - sa-east-1
security:
- aws_sigv4: []
tags:
- name: Global Clusters
  description: Operations for managing Neptune global database clusters
paths:
  /?Action=CreateGlobalCluster:
    post:
      operationId: createGlobalCluster
      summary: Amazon Neptune Create a Neptune Global Database Cluster
      description: Creates a Neptune global database spread across multiple AWS Regions. The global database contains a single primary cluster with read-write capability.
      tags:
      - Global Clusters
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - CreateGlobalCluster
      - name: GlobalClusterIdentifier
        in: query
        required: true
        description: The cluster identifier of the new global cluster.
        schema:
          type: string
      - name: SourceDBClusterIdentifier
        in: query
        description: The ARN of an existing Neptune cluster to use as the primary cluster.
        schema:
          type: string
      - name: DeletionProtection
        in: query
        description: Whether the global cluster has deletion protection enabled.
        schema:
          type: boolean
      - name: Version
        in: query
        required: true
        schema:
          type: string
          default: '2014-10-31'
      responses:
        '200':
          description: Global cluster created successfully.
        '400':
          description: Invalid request parameters.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /?Action=DescribeGlobalClusters:
    get:
      operationId: describeGlobalClusters
      summary: Amazon Neptune Describe Neptune Global Database Clusters
      description: Returns information about Neptune global database clusters.
      tags:
      - Global Clusters
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DescribeGlobalClusters
      - name: GlobalClusterIdentifier
        in: query
        description: The identifier of the global cluster to describe.
        schema:
          type: string
      - name: MaxRecords
        in: query
        schema:
          type: integer
      - name: Marker
        in: query
        schema:
          type: string
      - name: Version
        in: query
        required: true
        schema:
          type: string
          default: '2014-10-31'
      responses:
        '200':
          description: Successful response with global cluster details.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication
