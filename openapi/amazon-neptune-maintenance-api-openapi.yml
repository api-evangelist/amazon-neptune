openapi: 3.2.0
info:
  title: Amazon Neptune Management Maintenance API
  description: Amazon Neptune Management API for creating, managing, and deleting Neptune DB clusters, instances, parameter groups, snapshots, and related infrastructure resources. This is an AWS Query API that uses HTTPS requests with Action and parameter query strings.
  version: '2014-10-31'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/neptune/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://rds.{region}.amazonaws.com
  description: Amazon Neptune Management API regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-north-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1
      - ap-northeast-2
      - ap-south-1
      - ca-central-1
      - me-south-1
      - sa-east-1
security:
- aws_sigv4: []
tags:
- name: Maintenance
  description: Operations for managing pending maintenance actions
paths:
  /?Action=DescribePendingMaintenanceActions:
    get:
      operationId: describePendingMaintenanceActions
      summary: Amazon Neptune Describe Pending Maintenance Actions
      description: Returns a list of resources with pending maintenance actions.
      tags:
      - Maintenance
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DescribePendingMaintenanceActions
      - name: ResourceIdentifier
        in: query
        description: The ARN of a resource to filter maintenance actions.
        schema:
          type: string
      - name: MaxRecords
        in: query
        schema:
          type: integer
      - name: Marker
        in: query
        schema:
          type: string
      - name: Version
        in: query
        required: true
        schema:
          type: string
          default: '2014-10-31'
      responses:
        '200':
          description: Successful response with pending maintenance actions.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /?Action=ApplyPendingMaintenanceAction:
    post:
      operationId: applyPendingMaintenanceAction
      summary: Amazon Neptune Apply a Pending Maintenance Action
      description: Applies a pending maintenance action to a resource.
      tags:
      - Maintenance
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - ApplyPendingMaintenanceAction
      - name: ResourceIdentifier
        in: query
        required: true
        description: The ARN of the resource to apply the action to.
        schema:
          type: string
      - name: ApplyAction
        in: query
        required: true
        description: The pending maintenance action to apply.
        schema:
          type: string
      - name: OptInType
        in: query
        required: true
        description: The type of opt-in request (immediate, next-maintenance, undo-opt-in).
        schema:
          type: string
          enum:
          - immediate
          - next-maintenance
          - undo-opt-in
      - name: Version
        in: query
        required: true
        schema:
          type: string
          default: '2014-10-31'
      responses:
        '200':
          description: Maintenance action applied successfully.
        '404':
          description: The specified resource was not found.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication
