openapi: 3.2.0
info:
  title: Amazon Neptune Management Engine API
  description: Amazon Neptune Management API for creating, managing, and deleting Neptune DB clusters, instances, parameter groups, snapshots, and related infrastructure resources. This is an AWS Query API that uses HTTPS requests with Action and parameter query strings.
  version: '2014-10-31'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/neptune/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://rds.{region}.amazonaws.com
  description: Amazon Neptune Management API regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-north-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1
      - ap-northeast-2
      - ap-south-1
      - ca-central-1
      - me-south-1
      - sa-east-1
security:
- aws_sigv4: []
tags:
- name: Engine
  description: Operations for querying engine version information
paths:
  /?Action=DescribeDBEngineVersions:
    get:
      operationId: describeDBEngineVersions
      summary: Amazon Neptune Describe Neptune DB Engine Versions
      description: Returns a list of the available DB engine versions. The output shows the supported features and parameter group families for each version.
      tags:
      - Engine
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DescribeDBEngineVersions
      - name: Engine
        in: query
        description: The database engine to return versions for.
        schema:
          type: string
          default: neptune
      - name: EngineVersion
        in: query
        description: A specific engine version to return details for.
        schema:
          type: string
      - name: DBParameterGroupFamily
        in: query
        description: The parameter group family to filter versions by.
        schema:
          type: string
      - name: MaxRecords
        in: query
        schema:
          type: integer
      - name: Marker
        in: query
        schema:
          type: string
      - name: Version
        in: query
        required: true
        schema:
          type: string
          default: '2014-10-31'
      responses:
        '200':
          description: Successful response with engine version details.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication
