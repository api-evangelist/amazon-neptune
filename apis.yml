name: Amazon Neptune
description: >-
  Amazon Neptune is a fast, reliable, fully managed graph database service that makes it easy to build and run
  applications that work with highly connected datasets. It supports property graph and RDF models, with multiple query
  languages including Gremlin, SPARQL, and openCypher.
