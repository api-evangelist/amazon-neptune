- type: Features
  data:
  - name: Serverless Graph Database
    description: Automatically scales compute and memory resources based on workload demands without requiring capacity
      planning.
  - name: Multiple Query Language Support
    description: Supports Apache TinkerPop Gremlin, openCypher, and SPARQL 1.1 query languages for property graph
      and RDF models.
  - name: High Availability
    description: Multi-AZ deployment with up to 15 read replicas, automated failover, and continuous backups with
      point-in-time recovery up to 35 days.
  - name: Global Database
    description: Multi-region replication with sub-second latency across up to five secondary clusters for global
      applications.
  - name: Neptune Analytics
    description: Memory-optimized graph analytics engine for analyzing tens of billions of relationships within
      seconds with vector search capabilities.
  - name: GraphRAG Support
    description: Fully managed GraphRAG with Amazon Bedrock Knowledge Bases for AI-enhanced graph retrieval augmented
      generation.
  - name: Machine Learning on Graphs
    description: Native graph neural network support via Neptune ML powered by Amazon SageMaker for link prediction
      and node classification.
  - name: ACID Transactions
    description: Full ACID transaction support ensuring data consistency and integrity across graph operations.
  - name: AWS Security Integration
    description: VPC network isolation, IAM resource permissions, AWS KMS encryption, TLS in-transit encryption,
      and CloudWatch audit logging.
  - name: Auto-Expanding Storage
    description: Storage automatically grows up to 128 TiB with self-healing architecture spanning three availability
      zones.
- type: UseCases
  data:
  - name: Knowledge Graphs and GraphRAG
    description: Build knowledge graphs to enhance AI accuracy, comprehensiveness, and explainability using GraphRAG
      with Amazon Bedrock.
  - name: Fraud Detection
    description: Model transaction and account relationship networks to detect fraudulent patterns in near real-time
      using graph traversals.
  - name: Customer 360
    description: Build unified customer profile graphs linking purchases, preferences, and interactions for personalization
      and marketing.
  - name: Cybersecurity and Threat Detection
    description: Model IT infrastructure as a connected graph to detect attack paths, anomalies, and proactive threats.
  - name: Recommendation Engines
    description: Power product and content recommendation engines by traversing user-item relationship graphs.
  - name: Social Networks
    description: Model and query highly connected social graph data for applications requiring relationship traversal
      at scale.
  - name: Network and IT Operations
    description: Map network topology, dependencies, and configuration relationships for operations and impact analysis.
  - name: Supply Chain Management
    description: Model complex supply chain relationships and dependencies for optimization and risk analysis.
- type: Integrations
  data:
  - name: Amazon Bedrock
    description: Integration with Bedrock Knowledge Bases for fully managed GraphRAG and AI-enhanced knowledge graph
      applications.
  - name: Amazon SageMaker
    description: Neptune ML uses SageMaker for training graph neural network models on Neptune graph data.
  - name: Amazon S3
    description: Bulk data loading from S3 using the Neptune Loader API with CSV and RDF serialization format support.
  - name: AWS IAM
    description: Fine-grained resource-level access control and role-based permissions via AWS Identity and Access
      Management.
  - name: Amazon CloudWatch
    description: Metrics, logs, and audit logging for monitoring Neptune cluster performance and compliance.
  - name: AWS KMS
    description: Encryption at rest using AWS Key Management Service for customer-managed key support.
  - name: Amazon VPC
    description: Network isolation using Amazon Virtual Private Cloud with security group and firewall controls.
  - name: Apache TinkerPop
    description: Gremlin graph traversal language and TinkerPop ecosystem integration for property graph querying.
  - name: Strands AI Agents SDK
    description: Integration with Strands AI Agents SDK and popular agentic memory tools for AI agent applications.
